name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 -o /tmp/shfmt
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Bash syntax
        run: |
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -path './scripts/*' \) ! -path './.git/*' | sort)
          for file in "${files[@]}"; do
            bash -n "$file"
          done

      - name: Shellcheck
        run: |
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -path './scripts/*' \) ! -path './.git/*' | sort)
          shellcheck "${files[@]}"

      - name: shfmt
        run: |
          mapfile -t files < <(find . -type f \( -name '*.sh' -o -path './scripts/*' \) ! -path './.git/*' | sort)
          shfmt -d "${files[@]}"

      - name: Secret scan
        run: scripts/check-no-secrets

      - name: Repository tests
        run: tests/run.sh
